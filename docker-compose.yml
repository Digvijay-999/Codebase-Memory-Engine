services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contextforge-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}
      - PORT=8000
      - HOST=0.0.0.0
      # Trust X-Forwarded-For (the real client IP for rate limiting) only from the nginx proxy below.
      - FORWARDED_ALLOW_IPS=${PROXY_IP:-172.30.240.10}
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80,http://127.0.0.1:5173,http://127.0.0.1:3000,http://localhost:8001,http://127.0.0.1:8001
    volumes:
      - chroma_data:/app/chroma_db
      - repos_data:/app/repos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8001
    container_name: contextforge-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      default:
        ipv4_address: ${PROXY_IP:-172.30.240.10}
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        # Fixed so the proxy has a known IP. If it overlaps a network on the host, set DOCKER_SUBNET and PROXY_IP in .env.
        - subnet: ${DOCKER_SUBNET:-172.30.240.0/24}

volumes:
  chroma_data:
    driver: local
  repos_data:
    driver: local
