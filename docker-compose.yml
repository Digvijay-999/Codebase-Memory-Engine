services:
  backend:
    # Fixed image names, so images built elsewhere (scripts/ship-images.sh) match on any checkout folder.
    image: contextforge-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contextforge-backend
    restart: unless-stopped
    ports:
      # Local debugging only; the browser reaches the API through the frontend at /api.
      - "127.0.0.1:8001:8000"
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}
      - PORT=8000
      - HOST=0.0.0.0
      # Trust X-Forwarded-For (the real client IP for rate limiting) only from the nginx proxy below.
      - FORWARDED_ALLOW_IPS=${PROXY_IP:-172.30.240.10}
    volumes:
      - chroma_data:/app/chroma_db
      - repos_data:/app/repos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: contextforge-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Optional: an API on another origin (then also set ALLOWED_ORIGINS for the backend).
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: contextforge-frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "3000:80"
    networks:
      default:
        ipv4_address: ${PROXY_IP:-172.30.240.10}
    depends_on:
      backend:
        condition: service_healthy
        restart: true  # nginx resolves the backend once; restart it when compose recreates the backend

networks:
  default:
    ipam:
      config:
        # Fixed so the proxy has a known IP. If it overlaps a network on the host, set DOCKER_SUBNET and PROXY_IP in .env.
        - subnet: ${DOCKER_SUBNET:-172.30.240.0/24}

volumes:
  chroma_data:
    driver: local
  repos_data:
    driver: local
